name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  AI_REPAIR_ENABLED: "0"
  DOCKER_AUTOSTART: "0"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Check TypeScript and build the app
        run: npm run build

  browser:
    name: Login and account browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -r ../requirements.txt
      - run: npm ci
      - name: Install the browser and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Test login, invitations, permissions and sessions
        run: npx playwright test --config config/playwright/auth.ts --forbid-only --trace retain-on-failure --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Save browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/auth-test-results/
          retention-days: 7

  marking:
    name: Isolated Docker marking tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Create the temporary submission directory
        run: mkdir -p auto_marking/test_runner/submissions
      - name: Build the marking image
        run: docker build -t automarktic-runner:local auto_marking/test_runner
      - name: Check correct answers and reject incorrect answers in every suite
        run: python -m auto_marking.scripts.verify_sample_tests --docker
      - name: Save marking reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: marking-test-reports
          path: auto_marking/test_runner/out/
          retention-days: 7
